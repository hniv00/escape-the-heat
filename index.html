<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>Escape the Heat</title>
  <meta name="description" content="Find the nearest place to cool down during hot weather." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Escape the Heat" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="map" aria-label="Map"></div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="glass pill brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span data-i18n="appName">Escape the Heat</span>
    </div>
    <div class="topbar-right">
      <div class="glass pill temp" id="tempPill" hidden>
        <span id="tempValue">–</span>
      </div>
      <button class="glass pill lang" id="langToggle" aria-label="Switch language">EN</button>
    </div>
  </header>

  <!-- Fetch-in-progress indicator -->
  <div class="glass pill loading-pill" id="loadingPill" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <span data-i18n="loadingMore">Loading places…</span>
  </div>

  <!-- Locate button -->
  <button class="glass fab" id="locateBtn" aria-label="Center on my location">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>
    </svg>
  </button>

  <!-- Bottom sheet -->
  <div class="sheet glass" id="sheet">
    <div class="sheet-handle" aria-hidden="true"></div>

    <!-- Mode toggle -->
    <div class="mode-toggle" role="tablist" aria-label="Map mode">
      <button class="mode-btn" id="modeSpots" role="tab" aria-selected="true" data-i18n="modeSpots">Cool spots</button>
      <button class="mode-btn" id="modeHeat" role="tab" aria-selected="false" data-i18n="modeHeat">Heat map</button>
    </div>

    <!-- Layer chips -->
    <div class="chips" id="chips" role="group" aria-label="Map layers"></div>

    <!-- Notice (fallback location, errors) -->
    <div class="notice" id="notice" hidden></div>

    <!-- Smart picks -->
    <div class="picks" id="picks" role="group" aria-label="Smart recommendations" hidden></div>

    <!-- Recommendation / detail card -->
    <div class="card" id="card">
      <div class="card-loading" id="cardLoading">
        <div class="spinner" aria-hidden="true"></div>
        <span data-i18n="loading">Finding cool places near you…</span>
      </div>
      <div class="card-body" id="cardBody" hidden>
        <div class="card-top">
          <div class="card-emoji" id="cardEmoji">🌳</div>
          <div class="card-titles">
            <div class="card-kicker" id="cardKicker"></div>
            <h2 class="card-title" id="cardTitle"></h2>
          </div>
          <div class="card-temp">
            <div class="card-temp-value" id="cardTemp">–</div>
            <div class="card-temp-note" id="cardCooler"></div>
          </div>
        </div>
        <p class="card-quip" id="cardQuip" hidden></p>
        <div class="card-meta" id="cardMeta"></div>
        <div class="card-actions">
          <button class="btn btn-primary" id="routeBtn" data-i18n="showRoute">Show route</button>
          <button class="btn btn-ghost" id="clearBtn" data-i18n="back" hidden>Back</button>
        </div>
      </div>
      <div class="card-empty" id="cardEmpty" hidden>
        <span data-i18n="empty">No cooling spots found nearby. Try zooming out or moving the map.</span>
      </div>
    </div>

    <!-- Heat map legend -->
    <div class="heat-panel" id="heatPanel" hidden>
      <div class="heat-bar" aria-hidden="true"></div>
      <div class="heat-labels">
        <span id="heatLo">–</span>
        <span id="heatHi">–</span>
      </div>
      <p class="heat-note" data-i18n="heatNote">Live air temperature from a weather model (~1–2 km resolution).</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
